services:
  iptv_epg:
    build: .
    image: iptv_epg:dev
    container_name: iptv-epg
    restart: unless-stopped
    network_mode: host
    command: ["uvicorn", "iptv_epg.main:app", "--host", "0.0.0.0", "--port", "8088"]
    environment:
      - TZ=UTC
      - IPTV_EPG_VERSION=0.11.19
      - CONFIG_DIR=/config
      - DATA_DIR=/data
      - DB_PATH=/db/iptv_epg.db
      - LOG_DIR=/logs
    volumes:
      - ../config:/config
      - ../data:/data
      - ../db:/db
      - ../logs:/logs
