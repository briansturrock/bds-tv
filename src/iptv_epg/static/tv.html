<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>bds-tv</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="/static/favicon.png?v=0.13.22" type="image/png" />
  <link rel="stylesheet" href="/static/tv.css?v=0.13.22" />
</head>
<body>
  <main class="tv-app">
    <aside class="tv-sidebar">
      <div class="tv-brand">
        <h1>bds-tv <span id="tv-shell-version">TV shell 0.1.21</span></h1>
        <div id="tv-status">Loading guide...</div>
        <div id="tv-last-key" class="tv-key-debug">Last key: none</div>
      </div>
      <div id="tv-groups" class="tv-groups" aria-label="Channel groups"></div>
    </aside>

    <section class="tv-main">
      <header class="tv-header">
        <div>
          <h2 id="tv-group-title">Guide</h2>
          <p id="tv-group-meta">Select a group</p>
        </div>
        <div class="tv-header-actions">
          <div id="tv-days" class="tv-days" aria-label="Guide days"></div>
          <div class="tv-clock" id="tv-clock"></div>
        </div>
      </header>

      <div id="tv-guide" class="tv-guide" aria-label="Channels"></div>
    </section>
  </main>

  <section id="tv-player-shell" class="tv-player-shell hidden" aria-label="Player">
    <video id="tv-player" class="tv-player" controls autoplay playsinline></video>
    <div class="tv-player-overlay">
      <strong id="tv-player-title">Channel</strong>
      <span>Back closes playback</span>
    </div>
  </section>

  <section id="tv-context-shell" class="tv-context-shell hidden" aria-label="Programme actions" aria-hidden="true">
    <div class="tv-context-menu">
      <h2 id="tv-context-title">Programme</h2>
      <p id="tv-context-subtitle">Channel</p>
      <button id="tv-context-start" class="tv-context-choice focused" type="button">Start stream</button>
    </div>
  </section>

  <section id="tv-exit-shell" class="tv-exit-shell hidden" aria-label="Exit confirmation" aria-hidden="true">
    <div class="tv-exit-dialog">
      <h2>Close bds-tv?</h2>
      <p>Playback will stop and the app will close.</p>
      <div class="tv-exit-actions">
        <button id="tv-exit-yes" class="tv-exit-choice focused" type="button">Yes</button>
        <button id="tv-exit-no" class="tv-exit-choice" type="button">No</button>
      </div>
    </div>
  </section>

  <script src="/static/tv.js?v=0.13.22"></script>
</body>
</html>
