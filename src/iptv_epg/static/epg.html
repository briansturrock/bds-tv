<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>EPG Management</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/static/epg.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>EPG Management</h1>
      <p>Review EPGShare mappings, save choices, and generate the filtered EPG.</p>
    </div>
    <nav>
      <a href="/" target="_blank" rel="noopener">App</a>
      <a href="/dev/diagnostics" target="_blank" rel="noopener">Diagnostics</a>
      <a href="/dev/epgshare-matching" target="_blank" rel="noopener">Dev matching</a>
    </nav>
  </header>

  <section class="toolbar">
    <div class="actions">
      <button id="refresh">Refresh</button>
      <button id="import-index">Import/update EPGShare index</button>
      <button id="generate-epg">Generate filtered EPG</button>
    </div>
    <div class="links">
      <a href="/filtered.m3u" target="_blank" rel="noopener">filtered.m3u</a>
      <a href="/filtered_epg.xml" target="_blank" rel="noopener">filtered_epg.xml</a>
    </div>
  </section>

  <section id="summary" class="summary"></section>
  <section id="job-status" class="job-status"></section>

  <main class="layout">
    <aside class="channel-panel">
      <div class="panel-head">
        <h2>Selected channels</h2>
        <input id="channel-filter" placeholder="Filter channels..." />
      </div>
      <div id="channel-list" class="channel-list"></div>
    </aside>

    <section class="detail-panel">
      <div id="detail-empty" class="empty">
        Select a channel to review its EPG mapping.
      </div>

      <div id="detail" class="detail hidden">
        <div class="detail-header">
          <div>
            <h2 id="detail-title"></h2>
            <p id="detail-meta"></p>
          </div>
          <span id="detail-status" class="status"></span>
        </div>

        <section class="current">
          <h3>Current saved mapping</h3>
          <div id="current-mapping"></div>
        </section>

        <section>
          <h3>Suggestions</h3>
          <div id="suggestions"></div>
        </section>

        <section class="manual-search">
          <h3>Manual search</h3>
          <div class="search-row">
            <input id="manual-query" />
            <button id="manual-search">Search</button>
          </div>
          <div id="manual-results"></div>
        </section>

        <section class="save-bar">
          <button id="save-current">Save mapping</button>
          <button id="ignore-current">Mark as no EPG</button>
          <span id="save-state"></span>
        </section>
      </div>
    </section>
  </main>

  <script src="/static/epg.js"></script>
</body>
</html>
